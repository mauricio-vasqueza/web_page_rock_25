<!doctype html>
<html lang="en">
<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

  <title>Modelo de formulario página web</title>
</head>

<body>
  <div class="container">
    <form class="row g-3" id="miform" action="https://postman-echo.com/post" method="post">

      <div class="col-12">
        <label for="nombre" class="form-label">Nombre y Apellidos</label>
        <input type="text" class="form-control" id="nombre" name="nombre">
        <div class="text-danger" id="errorNombre"></div>
      </div>

      <div class="col-md-6">
        <label for="inputEmail4" class="form-label">Email</label>
        <input type="email" class="form-control" id="inputEmail4" name="email">
        <div class="text-danger" id="errorEmail"></div>
      </div>

      <div class="col-md-6">
        <label for="inputPassword4" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="inputPassword4">
      </div>

      <div class="col-md-6">
        <label for="telefono" class="form-label">Teléfono</label>
        <input type="tel" class="form-control" id="telefono" name="telefono">
        <div class="text-danger" id="errorTelefono"></div>
      </div>

      <div class="col-12">
        <label for="inputAddress" class="form-label">Direccion</label>
        <input type="text" class="form-control" id="inputAddress" name="direccion"
          placeholder="Calle de Galileo, 12">
        <div class="text-danger" id="errorDireccion"></div>
      </div>

      <div class="col-md-6">
        <label for="inputCity" class="form-label">Ciudad</label>
        <input type="text" class="form-control" id="inputCity">
      </div>

      <div class="col-md-4">
        <label for="inputState" class="form-label">Barrio</label>
        <select id="inputState" class="form-select">
          <option selected>Escoge...</option>
          <option>Arganzuela</option>
          <option>Retiro</option>
          <option>Salamanca</option>
          <option>Chamartín</option>
          <option>Tetúan</option>
          <option>Chamberí</option>
          <option>Fuencarral-El Pardo</option>
          <option>Moncloa-Aravaca</option>
          <option>Latina</option>
          <option>Carabanchel</option>
        </select>
      </div>

      <div class="col-md-2">
        <label for="inputZip" class="form-label">Código</label>
        <input type="text" class="form-control" id="inputZip">
      </div>

      <div class="col-12">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="gridCheck">
          <label class="form-check-label" for="gridCheck">Check me out</label>
          <div class="text-danger" id="errorCheck"></div>
        </div>
      </div>

      <div class="col-12">
        <button type="submit" class="btn btn-primary">Sign in</button>
      </div>

    </form>
  </div>

  <!-- Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
    crossorigin="anonymous"></script>

  <script type="text/javascript">

    function validar(e) {

      var nombre = document.getElementById("nombre");
      var telefono = document.getElementById("telefono");
      var inputEmail4 = document.getElementById("inputEmail4");
      var inputAddress = document.getElementById("inputAddress");
      var gridCheck = document.getElementById("gridCheck");

      errorNombre.innerText = "";
      errorTelefono.innerText = "";
      errorEmail.innerText = "";
      errorDireccion.innerText = "";
      errorCheck.innerText = "";

      if (nombre.value == "") {
        e.preventDefault();
        errorNombre.innerText = "El campo nombre es obligatorio.";
        nombre.focus();
        return false;
      }

      if (inputEmail4.value == "") {
        e.preventDefault();
        errorEmail.innerText = "El campo email es obligatorio.";
        inputEmail4.focus();
        return false;
      }

      if (inputAddress.value == "") {
        e.preventDefault();
        errorDireccion.innerText = "El campo dirección es obligatorio.";
        inputAddress.focus();
        return false;
      }

      if (telefono.value == "") {
        e.preventDefault();
        errorTelefono.innerText = "El campo teléfono es obligatorio.";
        telefono.focus();
        return false;
      }

      if (!gridCheck.checked) {
        e.preventDefault();
        errorCheck.innerText = "Debe marcar la casilla.";
        gridCheck.focus();
        return false;
      }

      return true;
    }

    function load() {
      miform.addEventListener("submit", validar);
    }

    document.addEventListener("DOMContentLoaded", load, false);

  </script>

</body>
</html>
